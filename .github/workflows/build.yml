name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Gradle Wrapper İzinlerini Ayarla
      run: chmod +x gradlew

    - name: Projeyi Derle
      run: ./gradlew build

    - name: Çıktı JAR Dosyasını Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: custom-client-jar
        path: build/libs/*.jar
